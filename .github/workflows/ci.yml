name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, intl, bcmath, pdo_sqlite, sqlite3, zip

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run PHP and frontend CI checks
        run: composer ci:check

  docker:
    name: Verify Docker image
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: steadytracker:${{ github.sha }}
          build-args: |
            VITE_APP_NAME=SteadyTracker
            VITE_API_URL=https://steadytracker.onrender.com
            VITE_REVERB_HOST=steady-reverb.onrender.com
            VITE_REVERB_PORT=443
            VITE_REVERB_SCHEME=https

  deploy:
    name: Trigger Render deployment
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy hooks
        env:
          RENDER_WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
          RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}
          RENDER_REVERB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_REVERB_DEPLOY_HOOK_URL }}
          RENDER_CRON_DEPLOY_HOOK_URL: ${{ secrets.RENDER_CRON_DEPLOY_HOOK_URL }}
        run: |
          hooks=(
            "$RENDER_WEB_DEPLOY_HOOK_URL"
            "$RENDER_WORKER_DEPLOY_HOOK_URL"
            "$RENDER_REVERB_DEPLOY_HOOK_URL"
            "$RENDER_CRON_DEPLOY_HOOK_URL"
          )

          configured=false
          for hook in "${hooks[@]}"; do
            if [ -n "$hook" ]; then
              configured=true
              curl --fail --silent --show-error --request POST "$hook"
            fi
          done

          if [ "$configured" = false ]; then
            echo "No Render deploy hooks are configured; skipping deployment."
          fi

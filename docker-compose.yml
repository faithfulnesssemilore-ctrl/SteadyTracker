services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-SteadyTracker}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      APP_FRONTEND_URL: http://localhost:8000
      CORS_ALLOWED_ORIGINS: http://localhost:8000
      DB_CONNECTION: mysql
      MYSQL_ATTR_SSL_CA: /var/www/html/certs/aiven-ca.pem
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_HOST: localhost
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      VITE_API_URL: http://localhost:8000
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: 8080
      VITE_REVERB_SCHEME: http
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$c=stream_context_create([\"http\"=>[\"timeout\"=>2]]); $r=@file_get_contents(\"http://127.0.0.1/up\",false,$c); exit($r!==false?0:1);'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["php", "artisan", "horizon"]
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      MYSQL_ATTR_SSL_CA: /var/www/html/certs/aiven-ca.pem
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      MYSQL_ATTR_SSL_CA: /var/www/html/certs/aiven-ca.pem
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      MYSQL_ATTR_SSL_CA: /var/www/html/certs/aiven-ca.pem
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
